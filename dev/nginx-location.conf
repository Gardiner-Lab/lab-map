    # ---- Lab Map ----------------------------------------------------------------
    location /map/ {
        set $map_upstream http://map:5010;
        proxy_pass $map_upstream;
        # Floor plans: PDFs from the architect run to tens of MB.
        client_max_body_size 65m;
        proxy_read_timeout 180s;
    }
    location = /map {
        return 301 /map/;
    }

